# Generated contract: tools/aam_website/publish.py PUBLIC_WORKFLOW
name: Validate and deploy AAM site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: aam-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public contract and create served-only artifact
        run: python3 .github/aam-site-check/publish.py public-stage --site . --output "$RUNNER_TEMP/aam-site-stage"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/aam-site-stage
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
