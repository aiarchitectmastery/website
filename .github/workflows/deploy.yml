# GitHub Actions — deploy AAM landing site to GitHub Pages.
# Activate this workflow only after `gh-pages/` has been moved into its own
# public repository (e.g. AIArchitectMastery/aiarchitectmastery.github.io).
# Until then this file is dormant inside the internal-material repo.

name: Deploy AAM site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Adjust this path if the workflow is moved to a repo where the site
          # lives at the repository root (then use "./").
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
